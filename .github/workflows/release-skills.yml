# Attaches the whole-plugin zip to every GitHub release, for the Plugins page's
# upload option on Claude Desktop / claude.ai (Settings → Customize → Plugins).
# Folder-wrapped — the layout git-marketplace installs already unpack. No
# per-skill zips: anyone wanting the Settings → Capabilities → Skills upload can
# zip a skills/<name> folder from the repo as-is.
name: Attach plugin zip to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the plugin zip
        run: |
          mkdir -p dist
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/saywise-skills"
          rsync -a --exclude .git --exclude .github --exclude dist ./ "$STAGE/saywise-skills/"
          (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/dist/saywise-plugin.zip" saywise-skills)
          ls -l dist
      - name: Upload zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
